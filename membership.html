<hr><br>

<div class="common-box join-box">
<form action="#" method="post">
  <div class="card-title">회원가입</div>

  <div style="margin-bottom: 8px;">
    <b>이름</b><br>
    <input type="text" name="name" id="name" placeholder="이름을 입력하세요">
  </div>
  
  <div style="margin-bottom: 8px;">
    <b>ID</b><br>
    <input type="text" name="id" id="id" placeholder="아이디를 입력하세요">
  </div>
  
  <div style="margin-bottom: 8px;">
    <b>PASSWORD</b><br>
    <input type="password" name="password" id="password" placeholder="비밀번호를 입력하세요">
  </div>
  
  <div style="margin-bottom: 8px;">
    <b>성별</b><br>
    남 <input type="radio" name="gender"> &nbsp;&nbsp;|&nbsp;&nbsp; 여 <input type="radio" name="gender">
  </div>
  
  <div style="margin-bottom: 8px;">
    <b>관심분야</b><br>
    웹디자인 <input type="checkbox" name="interest"> | 
    그래픽디자인 <input type="checkbox" name="interest"> | 
    제품디자인 <input type="checkbox" name="interest"> | 
    가구디자인 <input type="checkbox" name="interest"> | 
    자동차디자인 <input type="checkbox" name="interest">
  </div>
  
  <div style="margin-bottom: 8px;">
    <b>이메일</b><br>
    <input type="email" name="email" id="email" placeholder="abc@naver.com">
  </div>
  
  <div style="margin-bottom: 8px;">
    <b>학년</b><br>
    <select>
      <option>1학년</option>
      <option>2학년</option>
      <option>3학년</option>
      <option>4학년</option>
    </select>
  </div>
  
  <div style="margin-bottom: 12px;">
    <b>자기소개</b><br>
    <textarea rows="5" placeholder="자기소개를 작성해 주세요"></textarea>
  </div>
  
  <div style="text-align: center; margin-top: 15px;">
    <input type="submit" value="가입하기" class="btn-submit"> 
    <input type="reset" value="새로작성" class="btn-reset">
  </div>
</form>
</div>
